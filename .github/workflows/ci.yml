name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Start Kafka
        run: docker compose up -d kafka

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            docker compose exec -T kafka bash -lc "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list" && exit 0
            sleep 5
          done
          exit 1

      - name: Create topics
        run: |
          docker compose exec -T kafka bash -lc "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic input-event --partitions 6 --replication-factor 1"
          docker compose exec -T kafka bash -lc "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cache-log-event --partitions 6 --replication-factor 1"
          docker compose exec -T kafka bash -lc "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic processed-event --partitions 6 --replication-factor 1"

      - name: Start app
        run: docker compose up -d app

      - name: Publish sample input
        run: |
          cat <<'EOF' > sample.json
          {"eventId":"evt-1","eventTime":"2026-04-22T16:00:00Z","entity":{"productId":"p-100","entityId":"t-1","kind":"T","tValue":{"id":"t-1","name":"name-1","quantity":10},"sValue":null,"tsValue":null,"tombstone":false}}
          {"eventId":"evt-2","eventTime":"2026-04-22T16:00:01Z","entity":{"productId":"p-100","entityId":"s-1","kind":"S","tValue":null,"sValue":{"id":"s-1","status":"OPEN"},"tsValue":null,"tombstone":false}}
          EOF
          docker cp sample.json $(docker compose ps -q kafka):/tmp/sample.json
          docker compose exec -T kafka bash -lc "/opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic input-event --property parse.key=true --property key.separator='|' < <(awk '{print \"p-100|\" \$0}' /tmp/sample.json)"

      - name: Wait for processing
        run: sleep 20

      - name: Debug app logs
        run: docker compose logs app

      - name: Debug topic contents
        run: |
          docker compose exec -T kafka sh -lc '
            echo "INPUT:"
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server kafka:9092 \
              --topic input-event \
              --from-beginning \
              --timeout-ms 5000 2>/dev/null || true
          
            echo "PROCESSED:"
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server kafka:9092 \
              --topic processed-event \
              --from-beginning \
              --timeout-ms 5000 2>/dev/null || true
          
            echo "CACHE:"
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server kafka:9092 \
              --topic cache-log-event \
              --from-beginning \
              --timeout-ms 5000 2>/dev/null || true

      - name: Assert processed output exists
        run: |
          docker compose exec -T kafka sh -lc '
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server kafka:9092 \
              --topic processed-event \
              --from-beginning \
              --timeout-ms 10000 \
              > /tmp/out.txt 2>/dev/null || true
          
            test "$(wc -l < /tmp/out.txt)" -ge 2
          '

      - name: Assert cache log exists
        run: |
          docker compose exec -T kafka sh -lc '
            /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server kafka:9092 \
              --topic cache-log-event \
              --from-beginning \
              --timeout-ms 10000 \
              > /tmp/cache.txt 2>/dev/null || true
          
            test "$(wc -l < /tmp/cache.txt)" -ge 3
          '
